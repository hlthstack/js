name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Generated types are up to date
        run: npm run generate && git diff --exit-code src/generated
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node test/smoke/smoke.mjs
      - run: node test/smoke/smoke.cjs

  runtime:
    # The dev tooling needs Node 22+, but the published package supports Node 18+.
    name: Built package on Node ${{ matrix.node }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node test/smoke/smoke.mjs
      - run: node test/smoke/smoke.cjs
